<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIMA 360° · Plataforma de Evaluación</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../favicon.png">
<meta name="theme-color" content="#e64018">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --ink:#1A1A1A;--ink2:#3a3a3a;--paper:#FCFBF9;--paper2:#F4F1EC;--white:#fff;
  --cima:#e64018;--cima-d:#c4330f;--cima-l:#ff6a3c;--peach:#FDEAE2;
  --slate:#6b6b73;--rule:#E5E0D7;--negro:#0c0c0e;--grafito:#16161a;
  --ok:#2E7D52;--ok-l:#E3F2E9;--warn:#B7791F;--warn-l:#FBF0D9;--bad:#B42318;--bad-l:#FDE7E4;
  --serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',-apple-system,Segoe UI,Roboto,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--cima);text-decoration:none}
button{font-family:var(--sans);cursor:pointer}
h1,h2,h3{font-family:var(--serif);line-height:1.15}
h1{font-size:28px;font-weight:900}
h2{font-size:21px;font-weight:700}
h3{font-size:16px;font-weight:700}

/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--negro);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.side .brand{display:flex;flex-direction:column;gap:6px;padding:4px 8px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.side .brand img{height:38px;width:auto;align-self:flex-start;filter:brightness(0) invert(1)}
.side .brand span{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--cima-l);font-weight:700}
.side .lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#6b6b73;font-weight:700;padding:14px 10px 6px}
.side a{display:flex;align-items:center;gap:10px;color:#c9c9cf;padding:9px 10px;border-radius:8px;font-size:13.5px;font-weight:500}
.side a i{font-size:18px}
.side a:hover{background:rgba(255,255,255,.06);color:#fff}
.side a.on{background:rgba(230,64,24,.16);color:#fff}
.side a.on i{color:var(--cima-l)}
.side .me{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;color:#a0a0aa}
.side .me b{color:#fff;display:block;font-size:13.5px}
.side .me button{margin-top:10px;background:transparent;border:1px solid rgba(255,255,255,.18);color:#ddd;border-radius:100px;padding:6px 12px;font-size:12px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:16px 32px;border-bottom:1px solid var(--rule);background:var(--white);position:sticky;top:0;z-index:20}
.top .crumbs{font-size:13px;color:var(--slate);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumbs a{color:var(--slate)}
.top .crumbs a:hover{color:var(--cima)}
.top .demo{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:var(--warn-l);color:var(--warn);padding:4px 10px;border-radius:100px;white-space:nowrap}
.burger{display:none;background:none;border:none;font-size:24px;color:var(--ink)}
.view{padding:28px 32px 80px;max-width:1240px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head p{color:var(--slate);margin-top:4px;max-width:680px}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--cima);font-weight:700;margin-bottom:6px;display:block}

/* components */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--white);color:var(--ink);padding:9px 16px;border-radius:100px;font-size:13px;font-weight:700;white-space:nowrap;transition:all .15s}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--cima);border-color:var(--cima);color:#fff}
.btn.pri:hover{background:var(--cima-d)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--slate)}
.btn.ghost:hover{color:var(--cima)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--white);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.card + .card{margin-top:16px}
.card h3{margin-bottom:10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--white);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px}
.kpi .n{font-family:var(--serif);font-size:30px;font-weight:900;line-height:1.1}
.kpi .l{font-size:12px;color:var(--slate);font-weight:500}
.kpi .n small{font-size:14px;color:var(--slate);font-family:var(--sans);font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--slate);font-weight:700;padding:10px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--paper2);vertical-align:middle}
.tbl tr:hover td{background:#fdfaf6}
.tbl-wrap{overflow-x:auto}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:100px;background:var(--paper2);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--ok-l);color:var(--ok)}
.chip.warn{background:var(--warn-l);color:var(--warn)}
.chip.bad{background:var(--bad-l);color:var(--bad)}
.chip.cima{background:var(--peach);color:var(--cima-d)}
.bar{height:8px;background:var(--paper2);border-radius:100px;overflow:hidden;min-width:80px}
.bar > i{display:block;height:100%;background:var(--cima);border-radius:100px}
.muted{color:var(--slate)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:20px;overflow-x:auto}
.tabs a{padding:10px 14px;font-size:13.5px;font-weight:700;color:var(--slate);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--ink);border-color:var(--cima)}
.empty{text-align:center;padding:40px 20px;color:var(--slate)}
.empty i{font-size:34px;color:var(--cima);display:block;margin-bottom:8px}
.note{background:var(--paper2);border-left:3px solid var(--cima);padding:12px 14px;border-radius:0 8px 8px 0;font-size:13px;color:var(--ink2)}
.note.warn{border-color:var(--warn);background:var(--warn-l)}

/* forms */
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:12px;font-weight:700;color:var(--ink2)}
.f input,.f select,.f textarea{border:1px solid var(--rule);border-radius:8px;padding:9px 11px;font-family:var(--sans);font-size:14px;background:var(--white);color:var(--ink);width:100%}
.f textarea{min-height:80px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--cima)}
.f .hint{font-size:11.5px;color:var(--slate)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(12,12,14,.55);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:6vh 16px;overflow:auto}
.modal{background:var(--white);border-radius:16px;max-width:560px;width:100%;padding:24px 26px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal.wide{max-width:820px}
.modal h2{margin-bottom:14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:100px;font-size:13px;font-weight:500;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .l{background:radial-gradient(120% 120% at 80% 0%,#241008,var(--negro) 55%);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.login .l img{height:52px;width:auto;align-self:flex-start;filter:brightness(0) invert(1)}
.login .l h1{font-size:clamp(2.2rem,4vw,3.4rem);margin:28px 0 16px;color:#fff}
.login .l h1 em{color:var(--cima-l)}
.login .l p{color:#a0a0aa;max-width:460px;font-size:15.5px;line-height:1.8}
.login .l .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.login .l .pills span{border:1px solid rgba(255,255,255,.18);border-radius:100px;padding:6px 13px;font-size:12.5px;color:#ddd}
.login .r{padding:56px;display:flex;flex-direction:column;justify-content:center;max-width:520px;width:100%;margin:0 auto}
.login .r h2{margin-bottom:6px}
.ucard{display:flex;align-items:center;gap:12px;border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:var(--white);cursor:pointer;width:100%;text-align:left;transition:all .15s}
.ucard:hover{border-color:var(--cima);box-shadow:var(--shadow)}
.av{width:36px;height:36px;border-radius:50%;background:var(--peach);color:var(--cima-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.ucard b{display:block;font-size:14px}
.ucard small{color:var(--slate);font-size:12px}

/* questionnaire */
.q-shell{max-width:780px;margin:0 auto;padding:28px 20px 80px}
.q-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.q-top img{height:34px}
.q-hero{background:var(--negro);color:#fff;border-radius:16px;padding:26px 28px;margin-bottom:20px}
.q-hero h1{color:#fff;font-size:26px;margin-bottom:6px}
.q-hero p{color:#bdbdc4;font-size:14px}
.q-comp{background:var(--white);border:1px solid var(--rule);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.q-comp .ch{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.q-comp .ch b{width:28px;height:28px;border-radius:8px;background:var(--cima);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px}
.q-comp .cd{font-size:12.5px;color:var(--slate);margin-bottom:10px}
.q-item{padding:12px 0;border-top:1px solid var(--paper2)}
.q-item p{font-size:14px;margin-bottom:8px}
.scale{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media (max-width:640px){.scale{grid-template-columns:repeat(4,1fr)}}
.scale label{min-width:0;line-height:1.2;text-align:center;border:1px solid var(--rule);border-radius:8px;padding:7px 4px;font-size:12px;cursor:pointer;color:var(--ink2);background:var(--paper);user-select:none}
.scale label b{display:block;font-size:15px}
.scale input{display:none}
.scale input:checked + label{background:var(--cima);border-color:var(--cima);color:#fff}
.scale label.na{grid-column:1/-1;color:var(--slate);padding:5px 4px}
.progress-fixed{position:sticky;top:0;background:var(--paper);padding:10px 0;z-index:5}

/* report */
.rep-head{background:var(--negro);color:#fff;border-radius:16px;padding:26px 28px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rep-head h1{color:#fff}
.rep-head p{color:#bdbdc4}
.rep-head img{height:40px;filter:brightness(0) invert(1)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--slate)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.cmp-row{display:grid;grid-template-columns:170px 1fr 48px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--paper2)}
.cmp-bars{display:flex;flex-direction:column;gap:3px}
.cmp-bars div{height:9px;border-radius:100px}
.heat td.h{text-align:center;font-weight:700;border-radius:6px}
.radar text{font-family:var(--sans);font-size:11px;fill:var(--ink2)}
.quote{background:var(--paper2);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:8px;font-style:italic}

/* proposal print doc */
.doc{background:var(--white);max-width:860px;margin:0 auto;border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow)}
.doc .cover{background:var(--negro);color:#fff;padding:56px 56px 48px;position:relative;overflow:hidden}
.doc .cover::after{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(230,64,24,.45),transparent 70%)}
.doc .cover img{height:56px;filter:brightness(0) invert(1)}
.doc .cover h1{color:#fff;font-size:40px;margin:46px 0 10px}
.doc .cover h1 em{color:var(--cima-l)}
.doc .cover p{color:#bdbdc4}
.doc .sec{padding:34px 56px;border-bottom:1px solid var(--paper2)}
.doc .sec h2{margin-bottom:12px}
.doc .sec p{margin-bottom:10px;color:var(--ink2)}
.doc .sec ul{padding-left:20px;color:var(--ink2)}
.doc .sec li{margin-bottom:5px}
.phase{display:grid;grid-template-columns:44px 1fr;gap:14px;margin-bottom:14px}
.phase b{width:44px;height:44px;border-radius:10px;background:var(--cima);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px}
.price-tbl td{padding:9px 6px;border-bottom:1px solid var(--paper2)}
.pkg-tbl td,.pkg-tbl th{padding:8px 10px}
.price-tbl td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.price-tbl tr.tot td{font-size:18px;font-family:var(--serif);border-bottom:none;padding-top:14px}

@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .burger{display:block}
  .top{padding:12px 16px}
  .view{padding:20px 16px 70px}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .login{grid-template-columns:1fr}
  .login .l,.login .r{padding:32px 20px}
  .cmp-row{grid-template-columns:110px 1fr 40px}
  .doc .cover,.doc .sec{padding-left:22px;padding-right:22px}
}
@media print{
  .side,.top,.no-print{display:none!important}
  .app{display:block}
  .view{padding:0;max-width:none}
  body{background:#fff}
  .card,.doc{box-shadow:none;border-color:#ddd}
  .rep-head,.doc .cover,.q-hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card,.phase,.cmp-row{break-inside:avoid}
}
</style>
</head>

/* =====================================================================
   CAPA DE DATOS — Supabase
   Todo se carga al entrar (RLS filtra lo que cada rol puede ver) y cada
   cambio se sincroniza: DB.save() detecta qué registros cambiaron.
   ===================================================================== */
const TABLES = {orgs:'e360_orgs', people:'e360_people', models:'e360_models', campaigns:'e360_campaigns', assignments:'e360_assignments', coaching:'e360_coaching', proposals:'e360_proposals', users:'e360_members'};
const emptyDb = () => ({orgs:[], people:[], models:[], campaigns:[], assignments:[], coaching:[], proposals:[], users:[], settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS))});
let db = emptyDb();
let snap = {};
let saveChain = Promise.resolve();

function orgIdFor(coll, o){
  if (coll === 'orgs') return o.id;
  if (coll === 'assignments') return DB.camp(o.campaignId)?.orgId || null;
  if (coll === 'coaching') return DB.person(o.personId)?.orgId || null;
  if (coll === 'models') return null;
  return o.orgId || null;
}
function toRow(coll, o){
  const {id, ...data} = o;
  const row = {id, org_id:orgIdFor(coll, o), data};
  if (coll === 'assignments') { row.token = o.token; row.campaign_id = o.campaignId; }
  if (coll === 'users') row.email = String(o.email || '').toLowerCase();
  return row;
}
const fromRow = r => ({...(r.data || {}), id:r.id});
function snapshotAll(){
  snap = {};
  for (const c in TABLES) for (const o of db[c]) snap[c + ':' + o.id] = JSON.stringify(o);
  snap.settings = JSON.stringify(db.settings);
}

const DB = {
  async loadAll(){
    const d = emptyDb();
    const q = async (coll) => { const {data, error} = await sb.from(TABLES[coll]).select('id,data'); if (error) throw error; return (data || []).map(fromRow); };
    const staff = me.role === 'admin' || me.role === 'coach';
    [d.orgs, d.people, d.models, d.campaigns] = await Promise.all(['orgs', 'people', 'models', 'campaigns'].map(q));
    if (staff) {
      [d.assignments, d.coaching, d.proposals, d.users] = await Promise.all(['assignments', 'coaching', 'proposals', 'users'].map(q));
      const {data:st} = await sb.from('e360_settings').select('data').eq('id', 'main').maybeSingle();
      if (st?.data) d.settings = {...d.settings, ...st.data, packages:{...d.settings.packages, ...(st.data.packages || {})}};
    } else {
      /* Capital Humano: si la empresa no comparte reportes individuales, sólo recibe el avance (sin respuestas) */
      const org = d.orgs[0];
      if (org?.rhSeesIndividual) d.assignments = await q('assignments');
      else { const {data, error} = await sb.rpc('e360_assignments_progress'); if (error) throw error; d.assignments = (data || []).map(fromRow); }
      d.users = [me];
    }
    db = d;
    snapshotAll();
    /* Primer arranque: siembra los modelos de competencias base */
    if (me.role === 'admin' && !db.models.length) { db.models = JSON.parse(JSON.stringify(DEFAULT_MODELS)); DB.save(); }
    /* Migración: el modelo C·I·M·A·S se sustituye por el Modelo de Liderazgo 360°. Si algún proceso ya lo usa, se conserva para no romper sus reportes. */
    if (me.role === 'admin' && db.models.some(m => m.id === 'm_cima')) {
      if (!db.models.some(m => m.id === 'm_lid')) db.models.push(JSON.parse(JSON.stringify(DEFAULT_MODELS[0])));
      if (db.campaigns.some(c => c.modelId === 'm_cima')) { const old = DB.model('m_cima'); if (!/anterior/.test(old.name)) old.name += ' (anterior)'; }
      else db.models = db.models.filter(m => m.id !== 'm_cima');
      DB.save();
    }
    /* El modelo estándar siempre va primero (es el predeterminado al crear un proceso) */
    db.models.sort((a, b) => (b.id === 'm_lid') - (a.id === 'm_lid'));
  },
  save(){
    const ups = {}, dels = {};
    for (const c in TABLES) {
      const ids = new Set();
      for (const o of db[c]) {
        ids.add(o.id);
        const k = c + ':' + o.id, j = JSON.stringify(o);
        if (snap[k] !== j) { (ups[c] = ups[c] || []).push(toRow(c, o)); snap[k] = j; }
      }
      for (const k of Object.keys(snap)) if (k.startsWith(c + ':') && !ids.has(k.slice(c.length + 1))) { (dels[c] = dels[c] || []).push(k.slice(c.length + 1)); delete snap[k]; }
    }
    const st = JSON.stringify(db.settings), stChanged = st !== snap.settings;
    if (stChanged) snap.settings = st;
    /* Orden: primero padres (empresas, personas, procesos) y luego hijos */
    const order = ['users', 'orgs', 'models', 'people', 'campaigns', 'assignments', 'coaching', 'proposals'];
    saveChain = saveChain.then(async () => {
      try {
        if (stChanged) { const {error} = await sb.from('e360_settings').upsert({id:'main', data:db.settings}); if (error) throw error; }
        for (const c of order) if (ups[c]) { const {error} = await sb.from(TABLES[c]).upsert(ups[c]); if (error) throw error; }
        for (const c of [...order].reverse()) if (dels[c]) { const {error} = await sb.from(TABLES[c]).delete().in('id', dels[c]); if (error) throw error; }
      } catch (e) { console.error('[CIMA360] save', e); toast('No se pudo guardar: ' + (e.message || e)); }
    });
    return saveChain;
  },
  org: id => db.orgs.find(o => o.id === id),
  person: id => db.people.find(p => p.id === id),
  camp: id => db.campaigns.find(c => c.id === id),
  model: id => db.models.find(m => m.id === id),
  user: id => db.users.find(u => u.id === id),
  peopleOf: orgId => db.people.filter(p => p.orgId === orgId),
  campsOf: orgId => db.campaigns.filter(c => c.orgId === orgId),
  asgOf: cid => db.assignments.filter(a => a.campaignId === cid)
};

/* Sugerir evaluadores: auto + jefe + hasta 4 pares + colaboradores directos */
function suggestRaters(d, eid){
  const p = d.people.find(x => x.id === eid); if (!p) return [];
  const out = [{raterId:eid, rel:'auto'}];
  if (p.managerId) out.push({raterId:p.managerId, rel:'jefe'});
  d.people.filter(x => x.orgId === p.orgId && x.id !== eid && x.managerId && x.managerId === p.managerId).slice(0, 4).forEach(x => out.push({raterId:x.id, rel:'par'}));
  d.people.filter(x => x.managerId === eid).slice(0, 6).forEach(x => out.push({raterId:x.id, rel:'colaborador'}));
  return out;
}

/* =====================================================================
   CÁLCULOS 360 (con regla de anonimato: mínimo 3 por grupo)
   ===================================================================== */
const MIN_ANON = 3;
function compScore(a, comp){ const v = comp.items.map((_, i) => (a.answers || {})[comp.id + '_' + i]).filter(x => typeof x === 'number' && x >= 0); return avg(v); }
function results360(c, eid){
  const m = DB.model(c.modelId);
  const all = DB.asgOf(c.id).filter(a => a.evaluateeId === eid);
  const done = all.filter(a => a.status === 'completada');
  const by = rel => done.filter(a => a.rel === rel);
  const self = by('auto'), others = done.filter(a => a.rel !== 'auto');
  const groups = [];
  if (by('jefe').length) groups.push({key:'jefe', label:'Jefe directo', list:by('jefe')});
  const hidden = [];
  ['par', 'colaborador', 'cliente'].forEach(r => { const l = by(r); if (!l.length) return; if (l.length >= MIN_ANON) groups.push({key:r, label:RELS[r].label, list:l}); else hidden.push(...l); });
  if (hidden.length >= MIN_ANON) groups.push({key:'mix', label:'Pares y colaboradores (agrupado)', list:hidden});
  const scoreOf = (list, comp) => avg(list.map(a => compScore(a, comp)).filter(x => x != null));
  const comps = m.comps.map(cp => ({
    ...cp,
    self: self.length ? scoreOf(self, cp) : null,
    others: others.length >= MIN_ANON ? scoreOf(others, cp) : null,
    groups: groups.map(g => ({key:g.key, label:g.label, v:scoreOf(g.list, cp)}))
  }));
  const items = [];
  m.comps.forEach(cp => cp.items.forEach((t, i) => {
    const v = avg(others.map(a => (a.answers || {})[cp.id + '_' + i]).filter(x => typeof x === 'number' && x >= 0));
    if (v != null && others.length >= MIN_ANON) items.push({comp:cp.name, text:t, v});
  }));
  const comments = {};
  if (others.length >= MIN_ANON) OPEN_QS.forEach(q => { comments[q.id] = others.map(a => a.open?.[q.id]).filter(Boolean).sort(); });
  return {model:m, all, done, self, others, groups, comps, items, comments, hiddenCount:hidden.length >= MIN_ANON ? 0 : hidden.length,
          overall:others.length >= MIN_ANON ? avg(comps.map(c => c.others).filter(x => x != null)) : null,
          ready:others.length >= MIN_ANON};
}

  if (a.length < 8) return $('#sp_msg').textContent = 'La contraseña debe tener al menos 8 caracteres.';

  const {error} = await sb.auth.updateUser({password:a});
  if (error) return $('#sp_msg').textContent = 'No se pudo guardar: ' + error.message;
  location.hash = ''; await enter();
}
async function enter(){
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return renderLogin();
  const email = (session.user.email || '').toLowerCase();
  const {data, error} = await sb.from('e360_members').select('id,data').eq('email', email).maybeSingle();
  if (error || !data) {
    await sb.auth.signOut();
    return renderLogin(error ? 'No se pudo conectar con la plataforma. Intenta de nuevo.' : 'Tu cuenta no tiene acceso a la plataforma. Contacta a CIMA Leadership Institute.');
  }
  me = fromRow(data); me.email = email;
  try { await DB.loadAll(); } catch (e) { console.error('[CIMA360] load', e); await sb.auth.signOut(); me = null; return renderLogin('No se pudieron cargar los datos: ' + (e.message || e)); }
  booted = true;
  render();
}

function confirmDelOrg(id){

    <form id="qform">
    ${m.comps.map((cp, ci) => `<div class="q-comp"><div class="ch"><b>${ci + 1}</b><h3>${esc(cp.name)}</h3></div><div class="cd">${esc(cp.desc)}</div>

        ${SCALE.map(s => `<input type="radio" name="${k}" id="${k}_${s.v}" value="${s.v}"><label for="${k}_${s.v}"><b>${s.v}</b>${s.t}</label>`).join('')}

  $('#qform').addEventListener('change', () => { const n = new Set([...document.querySelectorAll('#qform input[type=radio]:checked')].map(x => x.name)).size; $('#qbar').style.width = (n / total * 100) + '%'; $('#qcount').textContent = n + '/' + total; });

async function submitQ(){
  const m = Q.model, ans = {}, open = {}; let missing = 0;
  m.comps.forEach(cp => cp.items.forEach((_, i) => { const k = cp.id + '_' + i, x = document.querySelector(`input[name="${k}"]:checked`); if (!x) missing++; else ans[k] = +x.value; }));
  if (missing) { toast(`Te faltan ${missing} preguntas por responder`); return; }
  OPEN_QS.forEach(q => { const t = document.querySelector(`[name="open_${q.id}"]`); if (t && t.value.trim()) open[q.id] = t.value.trim().slice(0, 2000); });
  const b = $('#qsend'); b.disabled = true; b.textContent = 'Enviando…';
  const {data, error} = await sb.rpc('e360_q_submit', {p_token:Q.token, p_answers:ans, p_open:open});
  if (error || !data) { b.disabled = false; b.innerHTML = 'Enviar evaluación <i class="ti ti-send"></i>'; toast('No se pudo enviar. Revisa tu conexión e intenta de nuevo.'); return; }
  const a = db.assignments.find(x => x.token === Q.token); if (a) { a.status = 'completada'; a.answers = ans; a.open = open; snapshotAll(); }
  renderRespond(Q.token);
}

function radarSVG(labels, series, size = 340){
  const n = labels.length, cx = size / 2, cy = size / 2, R = size / 2 - 58;
  const pt = (i, v) => { const ang = -Math.PI / 2 + i * 2 * Math.PI / n, rr = R * v / SCALE_MAX; return [cx + rr * Math.cos(ang), cy + rr * Math.sin(ang)]; };
  let g = '';
  [1, 2, 3, 4, 5, 6, 7].forEach(l => g += `<polygon points="${labels.map((_, i) => pt(i, l).join(',')).join(' ')}" fill="none" stroke="#E5E0D7" stroke-width="1"/>`);
  labels.forEach((lb, i) => { const [x, y] = pt(i, SCALE_MAX), [lx, ly] = pt(i, SCALE_MAX * 1.19); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E5E0D7"/><text x="${lx}" y="${ly}" text-anchor="${Math.abs(lx - cx) < 8 ? 'middle' : lx > cx ? 'start' : 'end'}" dominant-baseline="middle">${esc(lb)}</text>`; });
  series.forEach(s => { if (s.values.some(v => v == null)) return; g += `<polygon points="${s.values.map((v, i) => pt(i, v).join(',')).join(' ')}" fill="${s.color}" fill-opacity="${s.fill ?? .14}" stroke="${s.color}" stroke-width="2" ${s.dash ? 'stroke-dasharray="5 4"' : ''}/>`; });
  return `<svg class="radar" viewBox="-70 0 ${size + 140} ${size}" width="100%" style="max-width:${size + 140}px" role="img" aria-label="Radar de competencias">${g}</svg>`;
}

function quote(pr){
  const S = db.settings, pk = S.packages[pr.pkg];
  const lines = [{t:`Evaluación 360° · Paquete ${pk.name} (${pr.evaluados} personas × ${money(pk.price)})`, v:pk.price * pr.evaluados}];
  if (pr.design) lines.push({t:'Diseño de modelo de competencias desde cero', v:S.designFee});
  if (pr.nom) lines.push({t:`NOM-035 · Identificación de riesgo psicosocial (${pr.nomCount} colaboradores × ${money(S.nomPerEmployee)})`, v:S.nomPerEmployee * pr.nomCount});
  if (pr.extraSessions) lines.push({t:`Sesiones adicionales de coaching (${pr.extraSessions} × ${money(S.extraSession)})`, v:S.extraSession * pr.extraSessions});
  const sub = lines.reduce((s, l) => s + l.v, 0), disc = sub * (pr.discount || 0) / 100, base = sub - disc;
  return {lines, sub, disc, base, iva:base * IVA, total:base * (1 + IVA)};
}

function dupModel(){ const src = db.models[0], m = JSON.parse(JSON.stringify(src)); m.id = uid('m'); m.name = 'Modelo a la medida (copia)'; db.models.push(m); DB.save(); editModel(m.id); }
function editModel(id){
  const m = DB.model(id);
  const txt = m.comps.map(c => `# ${c.name} | ${c.desc}\n` + c.items.map(i => '- ' + i).join('\n')).join('\n\n');
  modal(`<h2>Editar modelo</h2>
    <div class="f"><label>Nombre</label><input id="md_n" value="${esc(m.name)}"></div>
    <div class="f"><label>Descripción</label><input id="md_d" value="${esc(m.desc)}"></div>
    <div class="f"><label>Competencias y reactivos</label><textarea id="md_t" style="min-height:320px;font-family:monospace;font-size:12.5px">${esc(txt)}</textarea>
    <span class="hint">Formato: <code># Competencia | descripción</code> y debajo cada conducta con <code>- </code>. Redacta en tercera persona ("Escucha con atención…").</span></div>
    ${db.campaigns.some(c => c.modelId === id) ? '<div class="note warn small">Este modelo ya se usa en un proceso. Cambiar reactivos afecta sus reportes; mejor crea una copia.</div>' : ''}
    <div class="acts"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="saveModel('${id}')">Guardar</button></div>`, true);
}
function saveModel(id){
  const m = DB.model(id), comps = [];
  val('md_t').split('\n').forEach(l => { l = l.trim(); if (l.startsWith('#')) { const [n, d] = l.slice(1).split('|'); comps.push({id:'K' + comps.length + '_' + Math.random().toString(36).slice(2, 5), name:n.trim(), desc:(d || '').trim(), items:[]}); } else if (l.startsWith('-') && comps.length) comps[comps.length - 1].items.push(l.slice(1).trim()); });
  if (!comps.length || comps.some(c => !c.items.length)) return toast('Cada competencia necesita al menos un reactivo');
  /* Conserva ids de competencias existentes para no romper respuestas previas */
  comps.forEach((c, i) => { if (m.comps[i] && m.comps[i].name === c.name) c.id = m.comps[i].id; });
  Object.assign(m, {name:val('md_n'), desc:val('md_d'), comps}); DB.save(); closeModal(); render();
}

        <li><b>Varias miradas por separado.</b> Autoevaluación, jefe, pares y colaboradores, con grupos protegidos de al menos ${MIN_ANON} personas.</li>
        <li><b>Brechas entre cómo me veo y cómo me ven.</b> Puntos ciegos y fortalezas ocultas son el centro de la conversación de retroalimentación.</li>
        <li><b>Para desarrollar, no para calificar.</b> El resultado se entrega con un coach y termina en un plan de desarrollo, no en una decisión de sueldo.</li>
      </ul></div>
    <div class="sec"><span class="eyebrow">El proceso</span><h2>Paso a paso</h2>
      ${step(1, 'Arranque (semana 1)', 'Capital Humano nos comparte la lista de colaboradores: nombre, correo o WhatsApp, puesto, área y jefe directo. Acordamos a quién se evalúa y con qué modelo de competencias.')}
      ${step(2, 'Evaluadores (semana 1)', 'La plataforma propone quién evalúa a cada líder según el organigrama: su jefe, de 3 a 5 compañeros y su equipo directo. Capital Humano lo revisa y lo ajusta con nosotros.')}
      ${step(3, 'Aplicación (semanas 2 y 3)', 'Cada evaluador recibe un enlace personal por correo o WhatsApp. Contesta desde el celular o la computadora en 12 a 15 minutos. Mandamos recordatorios a quien falte.')}
      ${step(4, 'Resultados (semana 4)', 'Generamos el reporte individual de cada líder y el reporte ejecutivo para la dirección.')}
      ${step(5, 'Desarrollo', 'Según el paquete contratado: sesión de retroalimentación 1 a 1, Plan Individual de Desarrollo, coaching con Marcelo Michel Leaño y nueva medición a los 6 meses.')}</div>
    <div class="sec"><span class="eyebrow">Quién hace qué</span><h2>Lo que vive cada persona</h2>
      <h3>Capital Humano</h3>
      <p>Entra a <b>cimaleadership.com.mx → Evaluación 360° → Ingresar a la plataforma</b> con el correo y la contraseña que le damos de alta. Ve sólo la información de su empresa: colaboradores, procesos y el avance en tiempo real${' '}(quién ya contestó y quién falta). Si así se acuerda, también puede ver y descargar los reportes.</p>
      <h3>Evaluadores</h3>
      <p>Reciben un enlace, lo abren y contestan. No necesitan usuario ni contraseña. Califican conductas concretas en una escala de 0 (nunca) a 7 (siempre), pueden marcar “no observado” y dejar comentarios opcionales.</p>
      <h3>Líderes evaluados</h3>
      <p>Contestan su autoevaluación. Al final reciben su reporte: cómo se ven ellos comparado con cómo los ven los demás, sus fortalezas, sus puntos ciegos y las conductas a desarrollar.</p>
      <h3>Dirección</h3>
      <p>Recibe el reporte ejecutivo: el perfil del equipo, el mapa de calor por persona y la recomendación de CIMA sobre dónde invertir en desarrollo.</p></div>
    <div class="sec"><span class="eyebrow">Confidencialidad</span><h2>Así cuidamos las respuestas</h2><ul>
      <li>Las respuestas de compañeros y colaboradores son <b>anónimas</b>: sólo se muestran como promedio cuando hay al menos ${MIN_ANON} personas en el grupo. Si son menos, se juntan con otro grupo.</li>
      <li>Los comentarios se muestran textuales, sin nombre.</li>
      <li>La opinión del jefe directo y la autoevaluación se muestran por separado.</li>
      <li>Cada empresa sólo ve su propia información, y cada usuario entra con su propia cuenta.</li>
      <li>El reporte individual es confidencial. Cada empresa decide si Capital Humano tiene acceso a él o si lo entrega CIMA en la sesión de retroalimentación.</li></ul></div>
    <div class="sec"><span class="eyebrow">NOM-035</span><h2>Si contrataste la NOM-035</h2>
      <p>Aplicamos las guías oficiales de la NOM-035-STPS-2018 que correspondan al tamaño del centro de trabajo y entregamos los resultados por categoría y dominio, con el nivel de riesgo de cada uno. La categoría <i>Liderazgo y relaciones en el trabajo</i> se cruza con los resultados del 360° para atender la causa y no sólo el síntoma.</p></div>
    <div class="sec"><span class="eyebrow">Preguntas frecuentes</span><h2>Lo que más nos preguntan</h2>
      ${faq('¿Cuánto tiempo toma contestar?', 'Entre 12 y 15 minutos por persona evaluada. Son 30 conductas y dos preguntas abiertas opcionales.')}
      ${faq('¿Se puede contestar desde el celular?', 'Sí. El enlace funciona en celular, tableta y computadora.')}
      ${faq('¿Qué pasa si alguien pierde su enlace?', 'Capital Humano o CIMA se lo reenvían desde la plataforma.')}
      ${faq('¿Mi jefe va a saber lo que contesté?', 'No. Las respuestas de compañeros y colaboradores sólo se ven como promedio de grupo y los comentarios no llevan nombre.')}
      ${faq('¿Cuántos evaluadores tiene cada líder?', 'Normalmente entre 6 y 10: su jefe, de 3 a 5 compañeros, su equipo directo y él mismo.')}</div>
    <div class="sec" style="background:var(--negro);color:#fff;border:none"><h2 style="color:#fff">Nos vemos en la cima.</h2><p style="color:#bdbdc4">CIMA Leadership Institute® · cimaleadership.com.mx</p></div>
  </div>`;
  return {crumbs:'Guía de uso', html};
}

/* ---------- arranque ---------- */
(async function boot(){
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  if (!sb) { $('#root').innerHTML = '<div class="q-shell"><div class="card empty"><i class="ti ti-wifi-off"></i>No se pudo cargar la plataforma. Revisa tu conexión y recarga la página.</div></div>'; return; }
  if (parts[0] === 'r') { booted = true; return renderRespond(parts[1]); }
  const {data:{session}} = await sb.auth.getSession();
  if (session && /type=(recovery|invite|signup)/.test(INITIAL_HASH)) return renderSetPassword();
  if (!session) { booted = true; return renderLogin(); }
  await enter();
})();
sb && sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') renderSetPassword(); });
</script>
